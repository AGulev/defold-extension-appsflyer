name: Build with bob

on: [push, pull_request]

permissions:
  contents: read

env:
  CHANNEL: stable
  BUILD_SERVER: https://build.defold.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: armv7-android, architectures: armv7-android, os: ubuntu-latest }
          - { platform: arm64-android, architectures: arm64-android, os: ubuntu-latest }
          - { platform: x86_64-linux, architectures: x86_64-linux, os: ubuntu-latest }
          - { platform: x86_64-win32, architectures: x86_64-win32, os: ubuntu-latest }
          - { platform: js-web, architectures: js-web, os: ubuntu-latest }
          - { platform: arm64-ios, architectures: 'arm64-ios,x86_64-ios', os: macos-latest }
          - { platform: x86_64-darwin, architectures: x86_64-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Download stable Bob
        shell: bash
        run: |
          DEFOLD_SHA=$(curl -fsSL "https://d.defold.com/${CHANNEL}/info.json" | jq -er '.sha1')
          curl -fsSL "https://d.defold.com/archive/${CHANNEL}/${DEFOLD_SHA}/bob/bob.jar" -o bob.jar
          java -jar bob.jar --version
      - name: Build and bundle without credentials
        run: >-
          java -jar bob.jar
          --platform=${{ matrix.platform }}
          --architectures=${{ matrix.architectures }}
          --build-server=${{ env.BUILD_SERVER }}
          --variant=debug --archive
          resolve build bundle
