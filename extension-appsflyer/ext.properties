[appsflyer]
title = AppsFlyer
group = Runtime
help = Settings for the AppsFlyer extension

key.type = string
key.label = Dev Key
key.help = AppsFlyer Dev Key for your registered app. Leave empty to disable SDK initialization.
key.default =

apple_app_id.type = string
apple_app_id.label = App Store ID iOS
apple_app_id.help = Numeric App Store ID without the id prefix. Required on iOS.
apple_app_id.default =

is_debug.type = bool
is_debug.label = Debug Logging
is_debug.help = Enable AppsFlyer SDK debug logging. Disable for release builds.
is_debug.default = 0

android_channel.type = string
android_channel.label = Channel Android
android_channel.help = Optional Android distribution channel, written to CHANNEL manifest metadata.
android_channel.default =
android_channel.private = 1

android_af_store.type = string
android_af_store.label = Store Android
android_af_store.help = Optional Android store name, written to AF_STORE manifest metadata.
android_af_store.default =
android_af_store.private = 1
